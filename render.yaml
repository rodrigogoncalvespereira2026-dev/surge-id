services:
  - type: web
    name: surge-id
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surge-id-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://rodrigogoncalvespereira2026-dev.github.io
databases:
  - name: surge-id-db
